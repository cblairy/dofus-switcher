[package]
name = "dofus-switcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11"] }
handy-keys = "0.3.4"
image = "0.25.10"
ocrs = "0.13.1"
rten = "0.26.0"
x11rb = "0.14.0"
serde = { version = "1", features = ["derive"] }
toml = "1.1.6"

# OCR inference is too slow with these dependencies in unoptimized dev builds.
[profile.dev.package.ocrs]
opt-level = 2

[profile.dev.package.rten]
opt-level = 2

[profile.dev.package.rten-gemm]
opt-level = 2

[profile.dev.package.rten-imageproc]
opt-level = 2

[profile.dev.package.rten-shape-inference]
opt-level = 2

[profile.dev.package.rten-tensor]
opt-level = 2
